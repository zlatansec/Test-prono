name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prono-aggregator-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish latest debug APK to a stable release
        if: github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          tag: apk-latest
          name: "APK debug (dernier build)"
          body: |
            Build automatique le plus récent de `${{ github.ref_name }}`.
            Commit : ${{ github.sha }}

            Ce lien est stable : à chaque push, l'APK ci-dessous est remplacé
            par le dernier build. Télécharge `app-debug.apk` et installe-le.
          artifacts: app/build/outputs/apk/debug/*.apk
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: true
